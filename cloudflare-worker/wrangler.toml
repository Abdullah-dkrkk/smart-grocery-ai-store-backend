name = "product-image-generator"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
BACKEND_API_URL = "https://your-laravel-api.com"

[[queues.producers]]
queue = "product-image-queue"
binding = "PRODUCT_IMAGE_QUEUE"

[[queues.consumers]]
queue = "product-image-queue"
max_batch_size = 5
max_retries = 3
max_concurrency = 2
dead_letter_queue = "product-image-dlq"

[[r2_buckets]]
bucket_name = "product-images"
binding = "PRODUCT_IMAGE_BUCKET"
